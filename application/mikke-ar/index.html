<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>mikke v.001</title>

  <!-- ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.122.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.122.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@0.6.11/lib/three-vrm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.5/three.js/build/ar-threex.min.js"></script>

  <link rel="stylesheet" href="./app.css" />
</head>
<body>

  <div id="ui">
    <div class="ui-main">
      <button id="startBtn" aria-label="AR開始">AR開始</button>

      <label>アバター：
        <select id="avatarSelect" aria-label="アバター選択"></select>
      </label>

      <label>ポーズ：
        <select id="poseSelect" aria-label="ポーズ選択"></select>
      </label>

      <button id="toggleAvatarBtn" class="secondary" disabled>アバター非表示</button>
      
    </div>

    <div class="ui-tray">
      <button id="moreBtn" class="secondary" aria-expanded="false" aria-controls="uiDetails">メニュー</button>
    </div>
  </div>

  <!-- 折りたたみ（詳細設定） -->
  <div id="uiDetails" role="region" aria-label="詳細設定">
    <div class="row" id="debugRow">
      <input type="checkbox" id="debugCheck" />
      <label for="debugCheck">デバッグ表示</label>
    </div>
    <div class="row"><span id="log">待機中…</span></div>
  </div>

  <div id="detectBanner">マーカー検出中</div>
  <video id="videoLayer" autoplay playsinline muted></video>
  <canvas id="threeLayer"></canvas>

  <!-- 撮影（下部中央シャッターボタン） -->
  <button id="captureBtn" aria-label="撮影する" title="撮影する"></button>

  <!-- スクリプのの読込 -->
  <script src="./js/ar.js"></script>
  <script src="./js/vrm.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/capture.js"></script>
</body>
</html>
