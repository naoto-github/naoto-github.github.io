// ─── Constants ─────────────────────────────────────────────────────────────
const STAGE_OPENING  = -1;
const STAGE_ENDING   = -2;
const STAGE_ORIGINAL = -3;
const STAGE_RANK     = -4;
const MAX_STAGE      = 10;
const MAX_LIFE       = 10;
const UNIT_ANGLE     = Math.PI / 180; // 1 degree
const BALL_R         = 30;
const GOAL_R         = 50;
const JUMP_R         = 100;
const WORP_HALF      = 20;
const WORP_COOLDOWN  = 3000;
const GRAVITY_BASE   = 1.0;
const GRAVITY_STEP   = 0.5;

const { Engine, Bodies, Body, Composite, Events } = Matter;

// ─── Game State ────────────────────────────────────────────────────────────
let engine, mWorld;
let ballBody = null, goalBody = null;
let slopes   = [];  // { body, w, h }
let lifts    = [];  // { body, w, h, initX, initY, upper, lower, speed }
let jumps    = [];  // { body }
let worps    = [];  // { body, x, y }

let currentStage = STAGE_OPENING;
let life         = MAX_LIFE;
let gravLevel    = GRAVITY_BASE;
let startTime    = 0;
let elapsedTime  = 0;
let totalTime    = 0;
let author       = "";

let scoreLog  = null;
let scoreList = loadScoreList();

let worpContact = false;
let worpTargetX = 0, worpTargetY = 0;
let worpTime    = 0;
let worpActive  = true;

let failPending = false; // prevent double-fail

// ─── Sound (Web Audio API) ─────────────────────────────────────────────────
let audioCtx = null;
function getAC() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// BGM – self-scheduling note sequencer
let bgmOn = false, bgmTid = null, bgmStep = 0;
const BGM = [
  [392,0.3],[523,0.3],[659,0.3],[784,0.3],
  [880,0.3],[784,0.3],[659,0.3],[523,0.3],
  [659,0.3],[784,0.3],[880,0.3],[1046,0.3],
  [880,0.3],[784,0.3],[659,0.3],[523,0.6],[null,0.3],
  [523,0.3],[659,0.3],[587,0.3],[523,0.3],
  [494,0.3],[440,0.3],[392,0.3],[330,0.3],
  [392,0.3],[440,0.3],[494,0.3],[523,0.3],
  [587,0.3],[659,0.3],[784,0.6],[null,0.6]
];
function startBGM() {
  if (bgmOn) return;
  bgmOn = true; bgmStep = 0; tickBGM();
}
function stopBGM() {
  bgmOn = false;
  if (bgmTid) { clearTimeout(bgmTid); bgmTid = null; }
}
function tickBGM() {
  if (!bgmOn) return;
  const ac = getAC();
  const [f, d] = BGM[bgmStep % BGM.length];
  if (f) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.07, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d * 0.85);
    o.start(); o.stop(ac.currentTime + d);
  }
  bgmStep++;
  bgmTid = setTimeout(tickBGM, d * 1000);
}

function loadSounds() {} // Web Audio API – no files needed

function playSound(n) {
  const ac = getAC();
  const t = ac.currentTime;
  const mk = (type, freq, start, dur, vol) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t + start);
    g.gain.exponentialRampToValueAtTime(0.001, t + start + dur);
    o.start(t + start); o.stop(t + start + dur + 0.01);
  };
  switch (n) {
    case 'bgm': startBGM(); break;
    case 'fall': {
      const o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(700, t);
      o.frequency.exponentialRampToValueAtTime(120, t + 0.45);
      g.gain.setValueAtTime(0.25, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      o.start(t); o.stop(t + 0.46);
      break;
    }
    case 'clear':
      [523, 659, 784, 1046].forEach((f, i) => mk('sine', f, i * 0.13, 0.28, 0.25));
      break;
    case 'fail':
      [392, 330, 262, 196].forEach((f, i) => mk('triangle', f, i * 0.15, 0.22, 0.2));
      break;
    case 'end':
      [262,330,392,523,659,523,659,784].forEach((f, i) => mk('square', f, i * 0.1, 0.18, 0.12));
      break;
    case 'rank':
      [523, 415, 330, 262].forEach((f, i) => mk('sawtooth', f, i * 0.22, 0.3, 0.18));
      break;
    case 'worp': {
      const o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type = 'sine';
      o.frequency.setValueAtTime(200, t);
      o.frequency.exponentialRampToValueAtTime(2000, t + 0.15);
      o.frequency.exponentialRampToValueAtTime(300, t + 0.3);
      g.gain.setValueAtTime(0.3, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      o.start(t); o.stop(t + 0.31);
      break;
    }
  }
}

// ─── Score ──────────────────────────────────────────────────────────────────
function makeScore(stage, time, grav) {
  return {
    uuid:    (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)),
    stage,
    time,
    gravity: grav,
    score:   stage * grav - Math.floor(time / 100)
  };
}
function loadScoreList() {
  try { return JSON.parse(localStorage.getItem('rb_scores') || '[]'); }
  catch(e) { return []; }
}
function addScore(log) {
  scoreList.push(log);
  scoreList.sort((a, b) => b.score - a.score);
  localStorage.setItem('rb_scores', JSON.stringify(scoreList));
}
function getRank(log) {
  for (let i = 0; i < scoreList.length; i++)
    if (scoreList[i].uuid === log.uuid) return i + 1;
  return -1;
}

// ─── Buttons ───────────────────────────────────────────────────────────────
function showButtons(...ids) {
  ['btn-start','btn-original','btn-restart'].forEach(id => {
    document.getElementById(id).style.display =
      ids.includes(id) ? 'block' : 'none';
  });
}

// ─── Physics ───────────────────────────────────────────────────────────────
function createEngine() {
  if (engine) Events.off(engine, 'collisionStart');
  engine = Engine.create();
  mWorld = engine.world;
  engine.gravity.y     = gravLevel;
  engine.gravity.scale = 0.001;
}

// ─── Stage ─────────────────────────────────────────────────────────────────
function initStage() {
  failPending  = false;
  worpContact  = false;
  worpActive   = true;

  createEngine();
  slopes = []; lifts = []; jumps = []; worps = [];
  ballBody = null; goalBody = null;

  if (currentStage === STAGE_OPENING) {
    stopBGM();
    showButtons('btn-start','btn-original');
    startTime = millis();
    return;
  }
  if (currentStage === STAGE_ENDING) {
    stopBGM();
    playSound('end');
    showButtons('btn-restart');
    startTime = millis();
    return;
  }
  if (currentStage === STAGE_RANK) {
    stopBGM();
    playSound('rank');
    showButtons();
    startTime = millis();
    return;
  }

  showButtons();
  playSound('bgm');

  const key  = currentStage === STAGE_ORIGINAL ? 'original' : currentStage;
  const data = STAGE_DATA[key];
  author     = data.author || '';
  let ballInitX = data.ball.x;

  // Slopes
  (data.slopes || []).forEach(s => {
    const b = Bodies.rectangle(s.x, s.y, s.w, s.h, {
      isStatic: true, label: 'slope',
      restitution: 0.4, friction: 0.05
    });
    Body.setAngle(b, UNIT_ANGLE);
    Composite.add(mWorld, b);
    slopes.push({ body: b, w: s.w, h: s.h });
  });

  // Lifts
  (data.lifts || []).forEach(l => {
    const b = Bodies.rectangle(l.x, l.y, l.w, l.h, {
      isStatic: true, label: 'lift',
      restitution: 0.4, friction: 0
    });
    Body.setAngle(b, l.r);
    Composite.add(mWorld, b);
    lifts.push({
      body: b, w: l.w, h: l.h,
      initX: l.x,
      upper: l.y + l.l / 2,
      lower: l.y - l.l / 2,
      speed: 1
    });
  });

  // Jumps
  (data.jumps || []).forEach(j => {
    const b = Bodies.circle(j.x, j.y, JUMP_R, {
      isStatic: true, label: 'jump',
      restitution: 2.8, friction: 0
    });
    Composite.add(mWorld, b);
    jumps.push({ body: b });
  });

  // Worps
  (data.worps || []).forEach(w => {
    const b = Bodies.rectangle(w.x, w.y, WORP_HALF*2, WORP_HALF*2, {
      isStatic: true, isSensor: true, label: 'worp'
    });
    Composite.add(mWorld, b);
    worps.push({ body: b, x: w.x, y: w.y });
  });

  // Ball
  ballBody = Bodies.circle(ballInitX, 0, BALL_R, {
    label: 'ball',
    restitution: 0.3, friction: 0, frictionAir: 0.001
  });
  ballBody._initX = ballInitX;
  Composite.add(mWorld, ballBody);

  // Goal
  goalBody = Bodies.circle(data.goal.x, data.goal.y, GOAL_R, {
    isStatic: true, isSensor: true, label: 'goal'
  });
  Composite.add(mWorld, goalBody);

  // Collision handler
  Events.on(engine, 'collisionStart', ev => {
    for (const { bodyA, bodyB } of ev.pairs) {
      const la = bodyA.label, lb = bodyB.label;
      if ((la==='ball'&&lb==='goal') || (la==='goal'&&lb==='ball')) {
        onClear();
      }
      if (worpActive && worps.length >= 2 &&
          ((la==='ball'&&lb==='worp') || (la==='worp'&&lb==='ball'))) {
        const worpBody = la==='worp' ? bodyA : bodyB;
        const idx = worps.findIndex(w => w.body === worpBody);
        if (idx >= 0) {
          const others = worps.filter((_,i) => i !== idx);
          const t = others[Math.floor(Math.random() * others.length)];
          worpTargetX = t.x; worpTargetY = t.y;
          worpContact = true;
          playSound('worp');
        }
      }
    }
  });

  playSound('fall');
  startTime = millis();
}

// ─── Game Events ───────────────────────────────────────────────────────────
function onClear() {
  if (failPending) return;
  playSound('clear');
  failPending = true;
  Composite.remove(mWorld, ballBody);
  ballBody = null;
  setTimeout(() => {
    failPending = false;
    nextStage();
  }, 800);
}

function fail() {
  if (failPending) return;
  failPending = true;
  playSound('fail');
  life = Math.max(life - 1, 0);

  setTimeout(() => {
    failPending = false;
    if (life === 0) {
      if (currentStage === STAGE_ORIGINAL) {
        currentStage = STAGE_OPENING;
      } else {
        scoreLog = makeScore(Math.max(currentStage - 1, 0), totalTime, gravLevel);
        addScore(scoreLog);
        currentStage = STAGE_RANK;
      }
      initStage();
    } else {
      // Reset slopes and ball
      slopes.forEach(s => Body.setAngle(s.body, UNIT_ANGLE));
      Body.setPosition(ballBody, { x: ballBody._initX, y: 0 });
      Body.setVelocity(ballBody, { x: 0, y: 0 });
      Body.setAngularVelocity(ballBody, 0);
      playSound('fall');
    }
  }, 1000);
}

function nextStage() {
  showButtons();
  if (currentStage === MAX_STAGE) {
    scoreLog = makeScore(currentStage, totalTime, gravLevel);
    addScore(scoreLog);
    currentStage = STAGE_ENDING;
  } else if (currentStage === STAGE_OPENING) {
    currentStage = 1;
    life      = MAX_LIFE;
    totalTime = 0;
    gravLevel = GRAVITY_BASE;
  } else if (currentStage === STAGE_ENDING) {
    currentStage = 1;
    life      = MAX_LIFE;
    totalTime = 0;
    gravLevel = Math.min(gravLevel + GRAVITY_STEP, 5);
  } else if (currentStage === STAGE_RANK || currentStage === STAGE_ORIGINAL) {
    currentStage = STAGE_OPENING;
  } else {
    totalTime += elapsedTime;
    currentStage++;
  }
  initStage();
}

function originalStage() {
  showButtons();
  currentStage = STAGE_ORIGINAL;
  life         = MAX_LIFE;
  gravLevel    = GRAVITY_BASE;
  initStage();
}

// ─── p5.js ─────────────────────────────────────────────────────────────────
function setup() {
  const cnv = createCanvas(1200, 800);
  cnv.parent('game-wrap');
  document.getElementById('btn-start').onclick    = nextStage;
  document.getElementById('btn-original').onclick = originalStage;
  document.getElementById('btn-restart').onclick  = nextStage;
  loadSounds();
  initStage();
}

function draw() {
  elapsedTime = millis() - startTime;

  if (currentStage === STAGE_OPENING) {
    drawOpening();
    return;
  }
  if (currentStage === STAGE_ENDING) {
    drawEnding();
    return;
  }
  if (currentStage === STAGE_RANK) {
    drawRank();
    if (elapsedTime > 5000) nextStage();
    return;
  }

  // Active gameplay
  if (!failPending) {
    // Continuous key input for slope rotation
    if (keyIsDown(LEFT_ARROW))  rotateSlopesBy(-UNIT_ANGLE);
    if (keyIsDown(RIGHT_ARROW)) rotateSlopesBy(+UNIT_ANGLE);

    updateLifts();
    handleWorp();
    if (ballBody && (ballBody.position.y > 900 || ballBody.position.x < -BALL_R || ballBody.position.x > 1200 + BALL_R)) fail();
  }
  // Substeps: split each frame into 4 smaller steps to prevent ball tunneling
  const SUB = 4;
  for (let i = 0; i < SUB; i++) Engine.update(engine, 1000 / 60 / SUB);
  drawGame();
}

// ─── Lift Update ───────────────────────────────────────────────────────────
function updateLifts() {
  lifts.forEach(l => {
    const newY = l.body.position.y + l.speed;
    Body.setPosition(l.body, { x: l.initX, y: newY });
    if (newY >= l.upper) l.speed = -Math.abs(l.speed);
    else if (newY <= l.lower) l.speed =  Math.abs(l.speed);
  });
}

// ─── Worp ──────────────────────────────────────────────────────────────────
function handleWorp() {
  if (worpContact && ballBody) {
    const vx = ballBody.velocity.x;
    Body.setPosition(ballBody, { x: worpTargetX, y: worpTargetY });
    Body.setVelocity(ballBody, { x: vx, y: 0 });
    worpContact = false;
    worpActive  = false;
    worpTime    = millis();
  }
  if (!worpActive && millis() - worpTime > WORP_COOLDOWN) {
    worpActive = true;
  }
}

// ─── Draw ──────────────────────────────────────────────────────────────────
function drawOpening() {
  background(0);
  textAlign(CENTER, CENTER);
  fill(255);
  textSize(100);
  text('ROLLING BALL', width/2, height/2 - 80);
  textSize(28);
  fill(255, 255, 0);
  text('Developed by mLab', width/2, height/2 - 10);
  textAlign(LEFT, BASELINE);
}

function drawEnding() {
  if (!scoreLog) return;
  const rank = getRank(scoreLog);
  background(0);
  noStroke();
  textAlign(CENTER, CENTER);
  fill(255, 255, 0); textSize(96);
  text('GAME CLEAR', width/2, height/2 - 200);
  textSize(56);
  fill(255);  text('Your Stage:', width/2 - 120, height/2 - 60);
  fill(255,255,0); text(scoreLog.stage, width/2 + 160, height/2 - 60);
  fill(255);  text('Your Time: ', width/2 - 120, height/2 + 30);
  fill(255,255,0); text((scoreLog.time/1000).toFixed(1) + ' s', width/2 + 160, height/2 + 30);
  fill(255);  text('Your Rank: ', width/2 - 120, height/2 + 120);
  fill(255,255,0); text(rank + ' / ' + scoreList.length, width/2 + 160, height/2 + 120);
  textAlign(LEFT, BASELINE);
}

function drawRank() {
  if (!scoreLog) return;
  const rank = getRank(scoreLog);
  background(0);
  noStroke();
  textAlign(CENTER, CENTER);
  fill(255, 0, 0); textSize(96);
  text('GAME OVER', width/2, height/2 - 200);
  textSize(56);
  fill(255);  text('Your Stage:', width/2 - 120, height/2 - 60);
  fill(255,255,0); text(scoreLog.stage, width/2 + 160, height/2 - 60);
  fill(255);  text('Your Time: ', width/2 - 120, height/2 + 30);
  fill(255,255,0); text((scoreLog.time/1000).toFixed(1) + ' s', width/2 + 160, height/2 + 30);
  fill(255);  text('Your Rank: ', width/2 - 120, height/2 + 120);
  fill(255,255,0); text(rank + ' / ' + scoreList.length, width/2 + 160, height/2 + 120);
  textAlign(LEFT, BASELINE);
}

function drawGame() {
  background(0);
  noStroke();

  // Slopes
  slopes.forEach(s => {
    fill(255);
    drawBox(s.body, s.w, s.h);
  });

  // Lifts
  lifts.forEach(l => {
    fill(30, 30, 220);
    drawBox(l.body, l.w, l.h);
  });

  // Jumps
  jumps.forEach(j => {
    fill(0, 220, 0);
    circle(j.body.position.x, j.body.position.y, JUMP_R * 2);
  });

  // Worps
  worps.forEach(w => {
    fill(worpActive ? color(0, 230, 230) : color(55, 55, 55));
    rectMode(CENTER);
    rect(w.body.position.x, w.body.position.y, WORP_HALF*2, WORP_HALF*2);
    rectMode(CORNER);
  });

  // Goal
  if (goalBody) {
    fill(220, 30, 30);
    circle(goalBody.position.x, goalBody.position.y, GOAL_R * 2);
  }

  // Ball
  if (ballBody) {
    fill(255, 230, 0);
    circle(ballBody.position.x, ballBody.position.y, BALL_R * 2);
  }

  // HUD
  const stageName = currentStage === STAGE_ORIGINAL ? 'original' : String(currentStage);
  fill(255); textSize(18); textAlign(LEFT, BASELINE);
  text('Author:  ' + author,                            width - 220, 45);
  text('Stage:   ' + stageName,                         width - 220, 72);
  text('Life:    ' + life,                              width - 220, 99);
  text('Gravity: ' + gravLevel.toFixed(1),              width - 220, 126);
  text('Time:    ' + (floor(elapsedTime/100)/10).toFixed(1) + ' sec', width - 220, 153);
}

function drawBox(body, w, h) {
  push();
  translate(body.position.x, body.position.y);
  rotate(body.angle);
  rectMode(CENTER);
  rect(0, 0, w, h);
  pop();
}

// ─── Input ──────────────────────────────────────────────────────────────────
function keyPressed() {
  if (currentStage > 0 || currentStage === STAGE_ORIGINAL) {
    if (key === 'f') { fail(); return false; }
    if (key === 'r') { life = 1; fail(); return false; }
    if (key === 'n') { if (!failPending) nextStage(); return false; }
    if (keyCode === LEFT_ARROW || keyCode === RIGHT_ARROW) return false; // handled in draw()
  }
}

function mouseDragged() {
  if (currentStage > 0 || currentStage === STAGE_ORIGINAL) {
    rotateSlopesBy(pmouseX < mouseX ? +UNIT_ANGLE : -UNIT_ANGLE);
  }
}

function rotateSlopesBy(delta) {
  slopes.forEach(s => Body.setAngle(s.body, s.body.angle + delta));
}
</script>
